name: Frontend CI

on:
  push:
    branches:
      - main
      - chore/frontend-js
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node 24 e cache npm
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências pelo lockfile
        run: npm ci

      - name: Compilar frontend
        run: npm run build
