name: Backend CI

on:
  push:
    branches:
      - main
      - chore/estrutura-inicial
      - chore/postgres-local
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar e testar backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: simpi_test
          POSTGRES_USER: simpi_ci
          POSTGRES_PASSWORD: simpi_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U simpi_ci -d simpi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/simpi_test
      POSTGRES_USER: simpi_ci
      POSTGRES_PASSWORD: simpi_ci_only
      # Chave pública exclusiva dos testes; Base64 de 32 bytes.
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar, testar e gerar JAR
        run: bash ./mvnw --batch-mode --no-transfer-progress verify -Pintegration