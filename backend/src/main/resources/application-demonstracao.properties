spring.datasource.url=jdbc:h2:mem:simpi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

jwt.secret=${JWT_SECRET:chave-local-de-demonstracao-simpi-2026-comprida-e-segura}
jwt.expiration=3600000

cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:http://localhost:5173,http://127.0.0.1:5173}

management.endpoints.web.exposure.include=health

management.endpoint.health.show-details=never
